name = "milgyo-accounting-maintenance"
main = "workers/accounting-maintenance.ts"
compatibility_date = "2026-07-01"

[observability]
enabled = true

# Cron은 UTC 기준입니다.
# 5분 간격: 비동기 세무 패키지 1단계 처리·실패 조각 정리
# 매일 18:20 UTC = 다음 날 03:20 KST: D1 메타정보 기준 R2 존재 점검 + 실패 작업 재처리
#                                             + 세무 패키지 큐 진행·실패 조각 정리
# 매주 토요일 18:40 UTC = 일요일 03:40 KST: D1·R2 전체 양방향 점검
[triggers]
crons = ["*/5 * * * *", "20 18 * * *", "40 18 * * 6"]

[[d1_databases]]
binding = "DB"
database_name = "milgyo-system-db"
database_id = "8c130839-aca2-4d85-8495-10460e07bbc5"

[[d1_databases]]
binding = "ACCOUNTING_DB"
database_name = "milgyo-accounting-db"
database_id = "48393ad7-8a7c-4a24-a9a9-5dbd685fd108"

[[r2_buckets]]
binding = "ACCOUNTING_FILES"
bucket_name = "milgyo-accounting-files"
