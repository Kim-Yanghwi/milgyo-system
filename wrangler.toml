name = "milgyo-system"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# 공식 홈페이지(milgyo-official-site)와 완전히 분리된 전용 D1입니다.
# Cloudflare 대시보드에서 D1 데이터베이스를 새로 만든 뒤(예: milgyo-system-db),
# 아래 database_id를 실제 값으로 채워 넣거나 Pages 프로젝트 설정 화면에서
# "DB"라는 이름으로 바인딩하세요(코드의 Env.DB와 이름이 일치해야 합니다).
[[d1_databases]]
binding = "DB"
database_name = "milgyo-system-db"
database_id = "8c130839-aca2-4d85-8495-10460e07bbc5"

# 첨부파일은 D1의 2MB 행 제한을 피하기 위해 R2 사용을 권장합니다.
# Cloudflare Pages 대시보드에서 R2 버킷을 만든 뒤 변수명 FILES로 바인딩하세요.
# 대시보드 바인딩을 사용하면 아래 설정은 추가하지 않아도 됩니다.
[[r2_buckets]]
binding = "FILES"
bucket_name = "milgyo-system-files"
